name: Lint marketplace

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint marketplace.json (versioning hygiene + source resolution)
        run: node scripts/check-marketplace.mjs
      - name: Run lint tests
        run: node --test scripts/*.test.mjs
      # The margins-docx comment injector is the one piece of executable code we
      # ship to installers, so its contracts (anchoring, idempotency, and the
      # never-touch-the-document invariant) are enforced here rather than trusted.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Run margins-docx injector tests
        run: uvx --with "python-docx>=1.2" --with pytest pytest plugins/margins/skills/margins-docx/tests
